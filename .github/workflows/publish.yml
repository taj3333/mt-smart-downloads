name: Publish release

# A new version is pushed to the "incoming" branch (VERSION, NOTES.md and the files under files/).
# This turns it into a GitHub release (marked latest) and then removes the branch.
on:
  push:
    branches: [incoming]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incoming
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(tr -d ' \r\n' < VERSION)
          test -n "$VERSION"
          ls -l files
          (cd files && sha256sum * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release delete "v$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" files/* SHA256SUMS.txt --target main --latest \
            --title "MT Smart System $VERSION" --notes-file NOTES.md
          echo "::notice title=Published::v$VERSION"
      - name: Remove the incoming branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --delete incoming || true
